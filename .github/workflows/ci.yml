name: CI

on:
  pull_request:
    branches: [main, "epic/*"]
  push:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core (required for mcp-server type resolution)
        run: pnpm --filter @gitgov/core run build

      - name: Typecheck core
        run: pnpm --filter @gitgov/core exec -- tsc --noEmit

      - name: Typecheck mcp-server
        run: pnpm --filter @gitgov/mcp-server run typecheck

      # cli runs TYPECHECK ONLY in CI, deliberately:
      # - tsc is static — no Postgres, no git remotes, no network — so 0 locally is 0 here.
      #   Its tsconfig no longer excludes test files: 285 errors (two of them real bugs)
      #   accumulated while nothing compiled them.
      # - The cli TESTS stay local-only for now: the e2e suites need Postgres and real git,
      #   and the unit suites have not been measured in a CI container yet. Running them
      #   here unmeasured risks a day-one red that gets the job switched off.
      - name: Typecheck cli
        run: pnpm --filter @gitgov/cli run typecheck

      # e2e typechecks everywhere with its single base config. `prisma generate` needs
      # only the schema, no database. (The core-gitlab conditional died when the GitLab
      # submodule left the repo entirely — its test moved out with it.)
      - name: Typecheck e2e
        run: |
          pnpm --filter @gitgov/e2e run prisma:generate
          pnpm --filter @gitgov/e2e run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git for tests
        run: |
          git config --global init.defaultBranch main
          git config --global user.email "ci@gitgovernance.dev"
          git config --global user.name "CI"

      - name: Build core (required by guardrail tests)
        run: pnpm --filter @gitgov/core run build

      - name: Test core
        run: pnpm --filter @gitgov/core run test

      - name: Test mcp-server
        run: pnpm --filter @gitgov/mcp-server run test

      # cli UNIT tests only (src/**). Measured before wiring: 509 passed in <3s under a
      # minimal environment (fake HOME, no .env) — they mock all I/O. The e2e suites
      # (e2e/**) stay local-only: they need PostgreSQL, real git remotes and the built
      # binary. That split lives in the command, not in a config exclude, so `pnpm test`
      # locally still runs everything.
      - name: Test cli (unit)
        run: pnpm --filter @gitgov/cli run test:unit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm --filter @gitgov/core run build

      - name: Build mcp-server
        run: pnpm --filter @gitgov/mcp-server run build
